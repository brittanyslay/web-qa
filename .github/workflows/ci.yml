name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python3 tests/test_qa_scan.py
      - name: Scan the demo site (expected to fail — it is deliberately broken)
        run: |
          python3 examples/demo-site/generate-fixtures.py
          if python3 scripts/qa-scan.py examples/demo-site; then
            echo "::error::scanner returned 0 on the broken demo site"; exit 1
          else
            echo "scanner correctly flagged the demo site"
          fi
