name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # 3.9 is no longer in the ubuntu-latest (26.04) toolcache, so pin it
          # to the last image that still ships it. Newer versions run on latest.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python3 tests/test_qa_scan.py
      - name: Scan the demo site (expected to fail - it is deliberately broken)
        run: |
          python3 examples/demo-site/generate-fixtures.py
          if python3 scripts/qa-scan.py examples/demo-site; then
            echo "::error::scanner returned 0 on the broken demo site"; exit 1
          else
            echo "scanner correctly flagged the demo site"
          fi
